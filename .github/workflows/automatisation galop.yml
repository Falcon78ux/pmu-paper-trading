name: Suivi PMU Galop automatique

on:
  schedule:
    - cron: "12,27,42,57 6-23 * * *"  # decale de quelques minutes par rapport au trot (7,22,37,52) pour ne jamais tourner exactement en meme temps
  workflow_dispatch: {}

jobs:
  verifier_galop:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          pip install requests

      - name: Verifier les courses galop a venir
        env:
          TELEGRAM_BOT_TOKEN_GALOP: ${{ secrets.TELEGRAM_BOT_TOKEN_GALOP }}
          TELEGRAM_CHAT_ID_GALOP: ${{ secrets.TELEGRAM_CHAT_ID_GALOP }}
        run: python scripts/verifier_a_venir_galop.py

      - name: Verifier les resultats galop
        env:
          TELEGRAM_BOT_TOKEN_GALOP: ${{ secrets.TELEGRAM_BOT_TOKEN_GALOP }}
          TELEGRAM_CHAT_ID_GALOP: ${{ secrets.TELEGRAM_CHAT_ID_GALOP }}
        run: python scripts/verifier_resultats_galop.py

      - name: Sauvegarder les fichiers galop mis a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etat_drivers_galop.json etat_pause_galop.json courses_notifiees_galop.json paris_virtuels_galop.csv bankroll_galopev.json bankroll_galopplace.json 2>/dev/null
          git diff --quiet --cached || git commit -m "Mise a jour automatique galop"
          git pull --rebase --autostash -X theirs origin main
          git push
