name: Suivi PMU automatique

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier les courses a venir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/verifier_a_venir.py

      - name: Verifier les resultats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/verifier_resultats.py

      - name: Keep-alive quotidien
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/keep_alive.py

      - name: Sauvegarder les fichiers mis a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $(ls etat_drivers.json etat_hippodromes.json etat_chevaux.json etat_chevaux_corde.json courses_notifiees.json paris_virtuels.csv dernier_run.json dernier_heartbeat.json bankroll_v14.json bankroll_v15.json bankroll_v18.json bankroll_v110.json bankroll_place.json bankroll_2sur4.json bankroll_trio.json bankroll_multi.json 2>/dev/null)
          git diff --quiet --cached || git commit -m "Mise a jour automatique"
          git pull --rebase --autostash -X ours origin main
          git push
